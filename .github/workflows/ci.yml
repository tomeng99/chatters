name: CI

# Merging to main publishes images that ArgoCD rolls out, so this is the last
# gate before production. It runs on pull requests and on main itself.
on:
  pull_request:
  push:
    branches:
      - main

# Both jobs only read the checkout and install from npm; nothing here writes
# to the repo, publishes a package or talks to the deployment.
permissions:
  contents: read

# A new push supersedes the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not the 20 the Dockerfiles build on: the test runner only
          # accepts glob patterns from 21 onwards.
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
