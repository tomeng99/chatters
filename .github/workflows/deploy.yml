name: Build and Push

on:
  push:
    branches:
      - main

# This workflow builds and publishes images only. Deployment is GitOps:
# ArgoCD syncs tomeng99/operations, so going live means bumping the image tag
# in apps/chatters/prod/deployments.yaml there.
env:
  SERVER_IMAGE: ghcr.io/tomeng99/chatters
  CLIENT_IMAGE: ghcr.io/tomeng99/chatters-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
          build-args: |
            EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}
            UMAMI_WEBSITE_ID=74559856-5ef1-4234-ad37-0fd2f5012fbc

      - name: Prune old GHCR images (keep 2 newest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in chatters chatters-client; do
            gh api "/user/packages/container/${pkg}/versions" --paginate \
              --jq 'sort_by(.created_at) | reverse | .[2:][].id' | \
            while read -r version_id; do
              echo "Deleting version ${version_id} from ${pkg}"
              gh api --method DELETE "/user/packages/container/${pkg}/versions/${version_id}" || true
            done
          done
